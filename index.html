<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#355b4d">
<title>阿黑・墨字小試</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="bamboo" x1="0" x2="1"><stop offset="0" stop-color="#6f4220"/><stop offset=".45" stop-color="#d4a05a"/><stop offset="1" stop-color="#7f5126"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e8cf"/><stop offset="1" stop-color="#bba67c"/></linearGradient>
    <linearGradient id="ferrule" x1="0" x2="1"><stop offset="0" stop-color="#1c1a18"/><stop offset=".5" stop-color="#4a4640"/><stop offset="1" stop-color="#1c1a18"/></linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#171717"/></linearGradient>
    <linearGradient id="stoneFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1b1b"/><stop offset="1" stop-color="#090909"/></linearGradient>
    <radialGradient id="inkPool" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#1d1d1d"/><stop offset="1" stop-color="#000"/></radialGradient>
    <clipPath id="tipClip"><rect x="0" y="184" width="44" height="46"/></clipPath>
  </defs>
</svg>
<header class="topbar">
  <span class="brand"><b>墨</b>阿黑的客字繪卷</span>
  <span class="topbar-sub">毛筆描寫・獨立試玩</span>
</header>

<main>
  <section id="practice">
    <div class="heading">
      <div>
        <p class="eyebrow">聽一句客語，留下一幅字</p>
        <h1>墨字小試</h1>
        <p class="lead">慢寫稍粗，快寫稍細。描完第三字，記得再沾一次墨。</p>
      </div>
      <div class="timer"><small>描寫時間</small><strong id="timer">00:00.00</strong></div>
    </div>

    <div class="toolbar">
      <label class="field-inline">腔調
        <select id="dialect">
          <option value="1">四縣腔</option><option value="2">海陸腔</option><option value="3">大埔腔</option>
          <option value="4">饒平腔</option><option value="5">詔安腔</option><option value="6">南四縣腔</option>
        </select>
      </label>
      <button id="drawQuestion" type="button">換一句</button>
      <button id="audio" type="button">▶ 聽客語</button>
    </div>

    <div class="sentence-card">
      <h2 id="sentence">正在準備五字題…</h2>
      <p id="meaning" class="meaning"></p>
      <small id="source"></small>
      <div id="steps" class="steps" aria-label="五字描寫進度"></div>
    </div>

    <div class="desk">
      <div class="paper">
        <canvas id="paper" width="512" height="512" aria-label="毛筆描寫區，按住滑鼠或用手指拖曳描字"></canvas>
        <span id="paperHint">先點墨硯，再開始下筆</span>
        <div id="brush" class="brush" data-brush aria-hidden="true"></div>
      </div>
      <aside class="tools">
        <button id="ink" class="inkstone" type="button" disabled aria-label="墨硯：點一下沾墨">
          <span class="stone-wrap">
            <svg class="stone" viewBox="0 0 240 170" aria-hidden="true" focusable="false">
              <ellipse cx="120" cy="152" rx="106" ry="12" fill="rgba(40,25,10,.3)"/>
              <path d="M12 84 H228 V130 Q228 142 216 142 H24 Q12 142 12 130 Z" fill="url(#stoneFront)"/>
              <path d="M32 26 H208 Q220 26 224 38 L232 84 H8 L16 38 Q20 26 32 26 Z" fill="url(#stoneTop)" stroke="#444" stroke-width="2"/>
              <path d="M44 38 H196 L204 76 H36 Z" fill="none" stroke="#2e2e2e" stroke-width="2"/>
              <path d="M128 46 H198 L202 70 H124 Z" fill="#262626"/>
              <path d="M136 54 L176 52 M134 60 L190 58 M132 66 L186 64" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
              <rect x="48" y="44" width="64" height="30" rx="7" fill="#020202" stroke="#555" stroke-width="1.5"/>
              <rect x="52" y="48" width="56" height="22" rx="5" fill="url(#inkPool)"/>
              <ellipse cx="68" cy="54" rx="14" ry="2.8" fill="#fff" opacity=".2"/>
              <ellipse class="ripple" cx="80" cy="60" rx="9" ry="3.5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
            </svg>
            <span class="dip-brush" data-brush></span>
          </span>
          <b id="inkLabel">沾墨開始</b>
        </button>
        <p id="inkInfo">五字共補墨一次</p>
        <button id="undo" type="button" disabled>撤回一筆</button>
        <button id="clear" type="button" disabled>重寫這個字</button>
        <button id="next" type="button" class="primary" disabled>寫好，下一字 →</button>
      </aside>
    </div>

    <p id="status" role="status">準備題目中…</p>
    <p class="note">試作評分只比較描寫覆蓋與偏離，不辨識筆順。所有成績僅供試玩，未送入排行榜。</p>
  </section>

  <section id="result" hidden>
    <div class="result-hero">
      <p class="eyebrow">一筆一畫，寫下今天學會的客語</p>
      <h1>你的客字繪卷</h1>
      <p id="feedback" class="lead"></p>
    </div>

    <div class="metrics">
      <div><small>描寫得分</small><strong id="score"></strong></div>
      <div><small>描寫時間</small><strong id="elapsed"></strong></div>
      <div><small>作品紀念章</small><strong>墨字初成</strong></div>
    </div>

    <div class="scroll-card">
      <div id="artwork" class="artwork"></div>
      <h2 id="resultSentence"></h2>
      <p id="resultMeaning" class="meaning"></p>
    </div>

    <div class="share">
      <div class="share-preview">
        <canvas id="card" width="1080" height="1350" aria-label="毛筆作品分享圖卡預覽"></canvas>
      </div>

      <div class="share-panel">
        <p class="eyebrow">把你的作品帶走</p>
        <h2>我用毛筆學客語</h2>
        <p class="lead">作品為主角，成績與評價一起留在圖卡上。</p>

        <label class="field">邀請遊玩的網址（選填）
          <input id="shareUrl" type="url" inputmode="url" placeholder="https://…">
        </label>

        <div class="actions">
          <button id="download" type="button" class="primary">↓ 下載作品圖</button>
          <button id="nativeShare" type="button">↗ 分享圖片</button>
          <button id="copy" type="button">複製文案</button>
        </div>

        <div class="social">
          <p>分享到</p>
          <div class="social-actions">
            <button type="button" class="social-button line" data-platform="line"><span class="social-icon"><img src="asset/social-icons/line.svg" alt="" aria-hidden="true"></span>LINE</button>
            <button type="button" class="social-button threads" data-platform="threads"><span class="social-icon"><img src="asset/social-icons/threads.svg" alt="" aria-hidden="true"></span>Threads</button>
            <button type="button" class="social-button facebook" data-platform="facebook"><span class="social-icon"><img src="asset/social-icons/facebook.svg" alt="" aria-hidden="true"></span>Facebook</button>
            <button type="button" class="social-button instagram" data-platform="instagram"><span class="social-icon"><img src="asset/social-icons/instagram.svg" alt="" aria-hidden="true"></span>Instagram</button>
          </div>
        </div>

        <p id="shareStatus" role="status"></p>
        <p class="note">作品紀念章由完成描寫取得。分享獎勵尚未啟用，開啟分享不代表已發文。</p>
      </div>
    </div>

    <div class="restart-row"><button id="restart" type="button">再描一次</button></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
